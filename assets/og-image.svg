<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Keshav Sharma — Animation Designer">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070d"/>
      <stop offset="100%" stop-color="#140d22"/>
    </linearGradient>
    <linearGradient id="ogAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A970FF"/>
    </linearGradient>
    <linearGradient id="ogText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A970FF"/>
      <stop offset="100%" stop-color="#D6C5FF"/>
    </linearGradient>
    <radialGradient id="ogGlow" cx="18%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- Frame -->
  <rect x="56" y="56" width="1088" height="518" rx="26" fill="none" stroke="#8B5CF6" stroke-opacity="0.28" stroke-width="2"/>

  <!-- Monogram -->
  <g transform="translate(96,104)">
    <rect width="72" height="72" rx="16" fill="#110d19" stroke="url(#ogAccent)" stroke-opacity="0.5"/>
    <path d="M20 20 V52" stroke="#F7F4FC" stroke-width="5" stroke-linecap="round"/>
    <path d="M34 20 L22 35.5" stroke="#F7F4FC" stroke-width="5" stroke-linecap="round"/>
    <path d="M24.5 34 L35 52" stroke="#A970FF" stroke-width="5" stroke-linecap="round"/>
    <path d="M56 22.5 c0-2.9-3.5-4.5-6.7-4.5 -3.8 0-6.7 2.1-6.7 5.8 0 3.3 2.5 4.8 5.8 6 3.6 1.3 5.9 2.7 5.9 6 0 3.7-3.2 6.2-7.1 6.2 -3.4 0-6.7-1.6-6.8-4.7" fill="none" stroke="#A970FF" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Name -->
  <text x="96" y="330" font-family="'Space Grotesk', Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-4">
    <tspan fill="#F7F4FC">Keshav </tspan><tspan fill="url(#ogText)">Sharma</tspan>
  </text>

  <!-- Role -->
  <text x="99" y="392" font-family="'Inter', Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="7" fill="#B7AEC8">ANIMATION DESIGNER</text>

  <!-- Tagline -->
  <text x="96" y="486" font-family="'Inter', Arial, sans-serif" font-size="30" font-weight="400" fill="#81788F">Motion, storytelling and craft — in every frame.</text>

  <!-- Accent line -->
  <rect x="96" y="520" width="220" height="4" rx="2" fill="url(#ogAccent)"/>
</svg>
