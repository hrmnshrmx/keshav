    <path d="M0 -46 c-19 0-32 15-32 37 0 15 6 27 14 34 l-5 25 c-19 11-30 32-33 59 h112 c-3-27-14-48-33-59 l-5-25 c8-7 14-19 14-34 0-22-13-37-32-37z" fill="#05030b"/>
  </g>
  <!-- grade bars -->
