<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Keshav Sharma</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ks-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@1&family=Sora:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=4e229242">
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px var(--gutter); position: relative; overflow: hidden; }
    .nf__code { font: 800 clamp(120px, 30vw, 260px)/.85 var(--font-head); letter-spacing: -.06em; background: linear-gradient(180deg, var(--violet-400), transparent 95%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nf h1 { font-size: clamp(28px, 5vw, 44px); margin: 12px 0 14px; }
    .nf p { color: var(--text-2); max-width: 420px; margin: 0 auto 32px; }
    .nf__actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="hero__bg" aria-hidden="true"><span class="orb orb--1"></span><span class="grid-lines"></span></div>
    <div>
      <a href="/" class="brand" aria-label="Keshav Sharma — home" style="justify-content:center;margin-bottom:40px">
        <span class="brand__mark" aria-hidden="true">KS</span>
        <span class="brand__text" style="text-align:left"><strong>Keshav Sharma</strong><small>Graphic Designer</small></span>
      </a>
      <div class="nf__code" aria-hidden="true">404</div>
      <h1>This page went <span class="accent-serif">off-grid.</span></h1>
      <p>The page you're looking for doesn't exist or has moved. Let's get you back to the good stuff.</p>
      <div class="nf__actions">
        <a href="/" class="btn btn--primary btn--lg">Back to home</a>
        <a href="/#work" class="btn btn--ghost btn--lg">See my work</a>
      </div>
    </div>
  </main>

</html>
